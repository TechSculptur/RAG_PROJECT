<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Enterprise RAG Assistant</title>

    <link rel="stylesheet" href="style.css">

    <!-- Markdown Parser for bold text and lists -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <!-- MathJax for rendering complex Neural Network formulas -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['\\(', '\\)']],
                displayMath: [['\\[', '\\]']]
            }
        };
    </script>

    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js">
    </script>

</head>

<body>

    <div class="app-container">

        <aside class="sidebar">

            <h2>⚙️ Document Management</h2>

            <p>
                Upload a PDF to add it to the knowledge base.
            </p>

            <input type="file" id="pdf-input" accept=".pdf">

            <button id="upload-btn">
                Upload & Process PDF
            </button>

            <div id="ingest-status"></div>

        </aside>


        <main class="chat-container">

            <header class="chat-header">

                <h1>📚 Enterprise Document Assistant</h1>

                <p>
                    Ask questions about your uploaded PDFs
                </p>

            </header>


            <div class="chat-box" id="chat-box"></div>


            <div class="input-area">

                <input type="text" id="user-input" placeholder="What is deep learning?..." autocomplete="off">

                <button id="send-btn">
                    Send
                </button>

            </div>

        </main>

    </div>


    <script src="script.js"></script>

</body>

</html>
